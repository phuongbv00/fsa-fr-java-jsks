  - FND:
    - fnd/index.md
    - Notes:
      - "Agile & Scrum": fnd/agile-and-scrum.md
      - "Git Fundamentals": fnd/git-fundamentals.md
      - "Pull Requests & Collaborative Workflow": fnd/pull-requests-and-conflicts.md
      - "AI-Assisted Development": fnd/ai-assisted-development.md
      - "Agile, Git & AI-Assisted Development Foundations — Appendix": fnd/appendix.md
    - Labs:
      - "Lab 01 — Refine the OrderDesk returns backlog": fnd/lab-01.md
      - "Lab 02 — Build, branch and recover an OrderDesk repository": fnd/lab-02.md
      - "Lab 03 — Pull requests, review and a rehearsed conflict": fnd/lab-03.md
      - "Lab 04 — Provoke the failure modes, then work the loop": fnd/lab-04.md
    - Assignments:
    - Templates:
